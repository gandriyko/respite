[package]
name = "respite-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
http-syntax = { path = "../http-syntax" }
http-env = { path = "../http-env" }
http-exec = { path = "../http-exec" }
http-curl = { path = "../http-curl" }
http-import = { path = "../http-import" }
respite-settings = { path = "../settings" }
arboard = { version = "3", default-features = false }
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
rpassword = "7"
serde_json = "1"
serde_json_path = "0.7"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tempfile = "3"
