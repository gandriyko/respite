[package]
name = "http-exec"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
http-syntax = { path = "../http-syntax" }
http-env = { path = "../http-env" }
reqwest = { version = "0.13", features = ["cookies", "gzip", "brotli", "deflate"] }
serde_json = "1"
serde_json_path = "0.7"
regex = "1"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
jiff = "0.2"
reqwest_cookie_store = "0.10"
cookie_store = { version = "0.22", features = ["serde_json"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
tempfile = "3"
