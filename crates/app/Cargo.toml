[package]
name = "respite"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
http-syntax = { path = "../http-syntax" }
http-env = { path = "../http-env" }
http-exec = { path = "../http-exec" }
respite-cli = { path = "../cli" }
http-curl = { path = "../http-curl" }
tokio = { version = "1", features = ["rt-multi-thread"] }
serde_json = "1"
ignore = "0.4"
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit", "runtime_shaders"] } # runtime_shaders: no Xcode `metal` needed
# tree-sitter: JSON highlighting in the response panel; -html also covers XML-ish bodies
gpui-component = { version = "=0.9.1", features = ["tree-sitter", "tree-sitter-html"] }
gpui-kit-assets = "=0.9.1"

[dev-dependencies]
tempfile = "3"
